---
- name: Check if version-specific backup already exists
  ansible.builtin.stat:
    path: "/opt/privx/etc/web-proxy-config.toml.backup-pre-upgrade-{{ privx_target_version }}"
  register: webproxy_backup_exists
  remote_user: "{{ REMOTE_USER | default('root') }}"
  become: "{{ BECOME | default('no') }}"
  delegate_to: "{{ target_host }}"

- name: Backup existing webproxy configuration file
  ansible.builtin.copy:
    src: /opt/privx/etc/web-proxy-config.toml
    dest: "/opt/privx/etc/web-proxy-config.toml.backup-pre-upgrade-{{ privx_target_version }}"
    remote_src: true
    backup: false
    mode: '0644'
  remote_user: "{{ REMOTE_USER | default('root') }}"
  become: "{{ BECOME | default('no') }}"
  register: webproxy_config_backup_result
  ignore_errors: true
  when: not webproxy_backup_exists.stat.exists
  delegate_to: "{{ target_host }}"

- name: Display configuration backup status
  ansible.builtin.debug:
    msg: "WebProxy backup status: {{ 'Success - New backup created' if (webproxy_config_backup_result.changed | default(false)) else ('Skipped - Backup already exists for version ' + (privx_target_version | string) if webproxy_backup_exists.stat.exists else 'Failed (original file may not exist)') }}"

- name: Upgrade PrivX-Web-Proxy
  ansible.builtin.package:
    name: "PrivX-Web-Proxy-{{ privx_target_version }}"
    state: present
  remote_user: "{{ REMOTE_USER | default('root') }}"
  become: "{{ BECOME | default('no') }}"
  register: webproxy_upgrade_result
  delegate_to: "{{ target_host }}"

- name: Copy new webproxy configuration file to server
  ansible.builtin.copy:
    src: "configuration_files/{{ target_host }}-web-proxy-config.toml"
    dest: /opt/privx/etc/web-proxy-config.toml
    owner: root
    group: root
    mode: '0644'
    backup: false
  remote_user: "{{ REMOTE_USER | default('root') }}"
  become: "{{ BECOME | default('no') }}"
  register: webproxy_config_deploy_result
  when: webproxy_upgrade_result.changed
  delegate_to: "{{ target_host }}"

- name: Run webproxy postinstall script
  ansible.builtin.command:
    cmd: /opt/privx/scripts/web-proxy-postinstall.sh
  timeout: 120
  remote_user: "{{ REMOTE_USER | default('root') }}"
  become: "{{ BECOME | default('no') }}"
  register: webproxy_postinstall_result
  when: webproxy_upgrade_result.changed
  delegate_to: "{{ target_host }}"
  failed_when: false
  changed_when: webproxy_postinstall_result.rc == 0

- name: Handle webproxy postinstall timeout or failure
  ansible.builtin.fail:
    msg:
      - "⚠️  WEBPROXY POSTINSTALL SCRIPT FAILED OR TIMED OUT"
      - ""
      - "Host: {{ target_host }}"
      - "Script: /opt/privx/scripts/web-proxy-postinstall.sh"
      - "Return Code: {{ webproxy_postinstall_result.rc | default('N/A') }}"
      - "Timeout: 120 seconds (2 minutes)"
      - ""
      - "--- SCRIPT OUTPUT ---"
      - "{{ webproxy_postinstall_result.stdout | default('No stdout output') }}"
      - ""
      - "--- SCRIPT ERRORS ---"
      - "{{ webproxy_postinstall_result.stderr | default('No stderr output') }}"
      - ""
      - "⚠️  MANUAL INTERVENTION REQUIRED"
      - ""
      - "Please troubleshoot the issue manually:"
      - "  1. SSH to {{ target_host }}"
      - "  2. Check webproxy logs: journalctl -u privx-web-proxy -n 100"
      - "  3. Verify configuration: cat /opt/privx/etc/web-proxy-config.toml"
      - "  4. Try running postinstall manually: /opt/privx/scripts/web-proxy-postinstall.sh"
      - "  5. Check system resources: df -h && free -h"
      - ""
      - "Playbook execution stopped. Fix the issue before continuing."
  when:
    - webproxy_upgrade_result.changed
    - webproxy_postinstall_result.rc is defined
    - webproxy_postinstall_result.rc != 0

- name: Display webproxy upgrade results
  ansible.builtin.debug:
    msg:
      - "PrivX-WebProxy upgrade completed on {{ target_host }}."
      - ""
      - "RPM Status: {{ 'Updated' if webproxy_upgrade_result.changed else 'Already up-to-date' }}"
      - "Configuration Backup: {{ 'New backup created' if (webproxy_config_backup_result.changed | default(false)) else ('Already backed up for v' + (privx_target_version | string) if webproxy_backup_exists.stat.exists else 'Skipped (original not found)') }}"
      - "Configuration Deploy: {{ 'Success' if (webproxy_config_deploy_result.changed | default(false)) else ('Skipped - No upgrade performed' if not webproxy_upgrade_result.changed else 'No changes needed') }}"
      - "Postinstall Status: {{ 'Completed successfully' if (webproxy_postinstall_result.rc | default(-1)) == 0 else ('Skipped - No upgrade performed' if not webproxy_upgrade_result.changed else 'Failed with return code ' + (webproxy_postinstall_result.rc | default(-1) | string)) }}"
