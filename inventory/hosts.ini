# host group for PrivX primary node to be upgraded first
[privx_primary]
privx-node1.example.com

# host group for PrivX addtional/secondary nodes to be upgraded after validation of primary node upgrade
[privx_additional_nodes]
privx-node2.example.com
privx-node3.example.com
privx-node4.example.com

# host group for PrivX extender servers ip
[privxextender]
# Add your PrivX Extender nodes here
# extender-node1.example.com
# extender-node2.example.com


# host group for PrivX Carrier servers ip
[privxcarrier]
# Add your PrivX Carrier nodes here
# IMPORTANT: Carrier and WebProxy nodes must be listed in PAIRING SEQUENCE
# The first carrier node will be paired with the first webproxy node, etc.
# Incorrect pairing can result in service downtime during upgrades!
# carrier-node1.example.com
# carrier-node2.example.com


# host group for PrivX WebProxy servers ip
[privxwebproxy]
# Add your PrivX WebProxy nodes here  
# IMPORTANT: WebProxy nodes must be listed in the SAME ORDER as Carrier nodes
# Each WebProxy node corresponds to the Carrier node at the same position
# webproxy-node1.example.com  # Pairs with carrier-node1
# webproxy-node2.example.com  # Pairs with carrier-node2

[all:vars]
# Privx-Target version
# ⚠️ IMPORTANT: Check "Supported upgrade paths" in PrivX product release notes
# before setting this value. Not all version upgrades are supported directly.
privx_target_version=42.0

# PrivX primary node validation file.
privx_validation_file="/tmp/privx_validation_done-{{ privx_target_version }}"

# Extender service stabilization wait time (seconds)
extender_stabilization_wait=30

# WAG (Web Access Gateway) upgrade settings
wag_pair_stabilization_wait=30

# ZDU (Zero Downtime Upgrade) settings
zdu_stabilization_wait=30

# Ansible remote user and become value, default set to root
# Uncomment and supply REMOTE_USER value if remote user is not root
REMOTE_USER=rocky
BECOME=yes

ansible_ssh_extra_args='-o StrictHostKeyChecking=no'
